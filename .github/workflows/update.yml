name: Update Data
on:
  workflow_dispatch:
  schedule:
    # Once a month on the 6th of every month
    - cron: '5 4 6 * *'
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data commit and create the release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium-headless-shell
    - name: Update data
      run: make clean && make tools.csv
    - name: Commit and release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet -- '*.csv'; then
          echo "No changes to the dataset, skipping release"
          exit 0
        fi
        version="v$(date +%Y.%-m.%-d)"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -m "Update Dataset" -- '*.csv'
        gh auth setup-git
        git push origin "HEAD:${GITHUB_REF_NAME}"
        gh release create "$version" --target "$(git rev-parse HEAD)" \
          --title "$version" --notes "Automated monthly dataset update" packages.csv tools.csv
