name: Test sitemap fetch
on:
  push:
    branches: [test-chromium-fallback]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    name: Fetch sitemap
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium-headless-shell
    - name: Fetch with fallback (as in production)
      run: python src/fetch_sitemap.py
    - name: Fetch with Chromium only
      working-directory: src
      run: python -c "import fetch_sitemap as f; f.download_with_browser(f.URL, '../sitemaps/browser.xml')"
    - name: Verify
      run: |
        ls -l sitemaps
        grep -c '<loc>' sitemaps/tools.xml sitemaps/browser.xml
